name: RecompileRadar Collector

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Что запустить"
        required: true
        type: choice
        options:
          - collector
          - telegram_test
        default: collector

  schedule:
    # 08:00, 15:00 и 23:00 по Москве (UTC+3)
    - cron: '0 5,12,20 * * *'

permissions:
  contents: write

jobs:
  run-task:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run collector
        if: github.event_name == 'schedule' || inputs.task == 'collector'
        run: python collector.py

      - name: Publish one verified game
        if: github.event_name == 'schedule'
        env:
          TASK: publish
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Send test message
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'telegram_test'
        env:
          TASK: telegram_test
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Save database changes
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.task == 'collector'))
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f data/published.json ]; then
            printf '{\n  "schema_version": 1,\n  "published_ids": []\n}\n' > data/published.json
          fi

          if [ ! -f data/review_queue.json ]; then
            printf '{\n  "schema_version": 1,\n  "last_updated": null,\n  "items": []\n}\n' > data/review_queue.json
          fi

          git add data/candidates.json data/published.json data/review_queue.json
          git diff --cached --quiet || git commit -m "Update RecompileRadar database"
          git push
